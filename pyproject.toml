[project]
name = "colosseum-assurance"
version = "0.1.0"
description = "Civilian UAV runtime-assurance study: closed-loop Colosseum episodes, independent evaluation, and audit-evidence reconstruction."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "msgpack>=1.0.8,<2",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "tyro>=0.8,<0.10",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.5,<0.15",
]

[project.scripts]
colassure = "colosseum_assurance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colosseum_assurance"]
# Generated identity stays out of Git, but must survive wheel installation in the worker image.
artifacts = ["src/colosseum_assurance/_build_provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live Colosseum simulator endpoint (skipped with a reason when absent)",
    "slow: longer-running local checks",
]
timeout = 300

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
